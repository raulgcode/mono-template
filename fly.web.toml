# The web on Fly.io (app.starter.example). Deployed by .github/workflows/deploy.yml after the
# API; by hand: `fly deploy --config fly.web.toml`. Secrets (same set as the API): docs/deploy.md.
app = "starter-web"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_URL = "https://app.starter.example"
  API_URL = "https://api.starter.example"
  CLIENT_IP_HEADER = "fly-client-ip"

[processes]
  app = "sh -c 'cd /app/apps/web && exec node_modules/.bin/react-router-serve build/server/index.js'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
