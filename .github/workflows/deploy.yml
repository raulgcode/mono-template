# Production on Fly.io (docs/deploy.md). A tag vX.Y.Z, pushed by `pnpm release`, deploys its
# commit once that commit's CI is green: first the API, whose release_command runs the
# migrations, then the web. "Run workflow" here does the same without a terminal: it creates the
# next tag with the same script and deploys it in this run (a tag pushed from Actions doesn't
# start another workflow).
name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major or an exact version (1.2.3)
        type: string
        default: patch

run-name: Deploy · ${{ github.event_name == 'push' && github.ref_name || format('release {0}', inputs.version) }}

# One deploy at a time, and a new one waits instead of cutting the one in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Create the tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm release "$VERSION" --yes
          echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    name: Wait for CI
    needs: tag
    # Runs after the tag job, or without it when the tag came from `pnpm release`.
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - id: ref
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
      # CI (ci.yml) runs on each push, the tag's included. A green run of this commit is enough;
      # otherwise it waits for the newest one and stops the deploy if it fails.
      - name: CI of this commit is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh run list --workflow ci.yml --commit "$sha" --limit 20 \
            --json databaseId,status,conclusion)
          if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")" -gt 0 ]; then
            echo "CI is green for $sha"
            exit 0
          fi
          id=$(jq -r '[.[] | select(.status != "completed")][0].databaseId // empty' <<< "$runs")
          if [ -z "$id" ]; then
            echo "::error::No green CI run for $sha: fix main and release again"
            exit 1
          fi
          gh run watch "$id" --exit-status --interval 30

  deploy:
    name: Deploy to Fly.io
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.starter.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci.outputs.tag }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      # The API first: its release_command migrates the database before the new web needs it.
      - name: API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
          TAG: ${{ needs.ci.outputs.tag }}
        run: flyctl deploy --config fly.api.toml --remote-only --image-label "$TAG"
      - name: Web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
          TAG: ${{ needs.ci.outputs.tag }}
        run: flyctl deploy --config fly.web.toml --remote-only --image-label "$TAG"
