# Playwright scenarios against a production build, Postgres and Mailpit. Only on demand: from
# your machine with `pnpm e2e:remote [branch]`, from the Actions tab, or from the GitHub API.
name: E2E

on:
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project (desktop, mobile or all)
        type: choice
        options: [all, desktop, mobile]
        default: all
      grep:
        description: Only scenarios whose title matches (optional)
        type: string
        required: false

run-name: E2E · ${{ github.ref_name }} · ${{ inputs.project }}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ inputs.project == 'all' && fromJSON('["desktop","mobile"]') || fromJSON(format('["{0}"]', inputs.project)) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Playwright
        env:
          PROJECT: ${{ matrix.project }}
          GREP: ${{ inputs.grep }}
        run: pnpm test:e2e --project="$PROJECT" ${GREP:+--grep "$GREP"}
      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
